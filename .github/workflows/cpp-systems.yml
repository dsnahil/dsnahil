name: C++ systems verification
on:
  push:
    paths: ['cpp-systems/**', '.github/workflows/cpp-systems.yml']
  pull_request:
    paths: ['cpp-systems/**', '.github/workflows/cpp-systems.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: g++
            mode: Release
            sanitize: 'OFF'
          - compiler: clang++
            mode: Release
            sanitize: 'OFF'
          - compiler: clang++
            mode: Debug
            sanitize: 'ON'
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp-systems -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=${{ matrix.mode }} -DENABLE_SANITIZERS=${{ matrix.sanitize }}
      - name: Build
        run: cmake --build build -j 2
      - name: Verify native and independent reference tests
        run: ctest --test-dir build --output-on-failure
  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test non-root runtime image
        run: docker build -t cpp-systems cpp-systems
      - name: Smoke test CLIs
        run: |
          docker run --rm cpp-systems timingforge --help
          docker run --rm cpp-systems logicscope --help
